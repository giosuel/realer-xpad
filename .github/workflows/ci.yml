name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install GTK, libadwaita and tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            curl ca-certificates git shellcheck
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: ShellCheck
        run: shellcheck install.sh tools/*.sh packaging/*/*.sh

  test:
    name: Test (GTK ${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian 13 ships GTK 4.18 / libadwaita 1.7; Fedora tracks the latest.
        distro: ["debian:trixie", "fedora:latest"]
    container: ${{ matrix.distro }}
    steps:
      - name: Install GTK, libadwaita and sway
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-common \
              sway dbus fonts-dejavu-core curl ca-certificates git
          else
            dnf install -y gcc pkgconf-pkg-config gtk4-devel libadwaita-devel \
              sway dbus-daemon dejavu-sans-fonts libcap curl git
            # Fedora's sway carries file capabilities that containers don't grant.
            setcap -r /usr/bin/sway
          fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - name: UI tests (headless Wayland)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo build --locked --test ui
          dbus-run-session -- tools/headless.sh cargo test --locked --test ui

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Built on Debian 13 (glibc 2.41, GTK 4.18) so the binary runs on current distros.
    container: debian:trixie
    steps:
      - name: Install GTK and libadwaita
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev curl ca-certificates git
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/realer-xpad --version
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="realer-xpad-$version-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/realer-xpad install.sh LICENSE README.md "dist/$name/"
          cp -r extras "dist/$name/"
          mkdir -p "dist/$name/data/icons/hicolor/scalable/apps"
          cp data/icons/hicolor/scalable/apps/ch.giosuel.RealerXpad.svg "dist/$name/data/icons/hicolor/scalable/apps/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  appimage:
    name: AppImage
    needs: [lint, test]
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-common \
            adwaita-icon-theme file curl ca-certificates git sway dbus fonts-dejavu-core
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: tools/build-appimage.sh dist
      - name: Smoke test (native Wayland window on headless sway)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) APPIMAGE_EXTRACT_AND_RUN=1 REALER_XPAD_DATA=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          appimage=$(ls dist/*.AppImage)
          "$appimage" --version
          dbus-run-session -- tools/headless.sh bash -c '
            "$0" & sleep 5
            sock=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock)
            swaymsg -s "$sock" -t get_tree | grep -q "\"app_id\": *\"ch.giosuel.RealerXpad\"" ||
              { echo "no native Wayland window with app_id ch.giosuel.RealerXpad" >&2; exit 1; }
            "$0" quit' "$appimage"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/

  flatpak:
    name: Flatpak
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Flathub's own builder image, matching the manifest's runtime.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/flatpak/ch.giosuel.RealerXpad.yml
          bundle: Realer_Xpad-${{ steps.version.outputs.version }}-x86_64.flatpak
          # Inside .flatpak-builder, which the manifest's dir source skips.
          build-dir: .flatpak-builder/build
          repo-dir: .flatpak-builder/repo
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: Realer_Xpad-*.flatpak

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true  # tarball, AppImage (+ .zsync) and Flatpak side by side
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Realer Xpad ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  aur:
    name: AUR (${{ matrix.pkg }})
    # Stable releases only, after the GitHub release (and its tarball) exists.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [realer-xpad, realer-xpad-bin]
    steps:
      - uses: actions/checkout@v7
      - name: Set pkgver
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            "packaging/aur/${{ matrix.pkg }}/PKGBUILD"
      # Builds the package (checksums refreshed, dependencies installed), then
      # pushes PKGBUILD and a fresh .SRCINFO to the AUR.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: giosuel
          commit_email: me@giosuel.ch
          commit_message: Update to ${{ github.ref_name }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
