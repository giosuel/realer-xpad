[package]
name = "realer-xpad"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Sticky notes with Markdown and drawing for Wayland/Hyprland"
license = "AGPL-3.0-only"
authors = ["giosuel <me@giosuel.ch>"]
repository = "https://github.com/giosuel/realer-xpad"
homepage = "https://giosuel.github.io/realer-xpad/"
readme = "README.md"
keywords = ["notes", "sticky-notes", "markdown", "gtk4", "wayland"]
categories = ["gui"]

[lib]
name = "realer_xpad"
path = "src/lib.rs"

[[bin]]
name = "realer-xpad"
path = "src/main.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false  # GTK must live on one thread; the test runs its own loop

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gio = { version = "0.22", features = ["v2_80"] }  # GTK 4.16 needs GLib 2.80 anyway
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # timestamps must survive save/load exactly

[dev-dependencies]
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
strip = true
