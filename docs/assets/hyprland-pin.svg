<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Pinned notes on Hyprland</title>
  <desc id="d">Switching between three workspaces while a pinned sticky note stays in place.</desc>
  <defs>
    <clipPath id="screen"><rect x="40" y="30" width="560" height="250" rx="12"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1830"/><stop offset="1" stop-color="#0f1a22"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      text { font-family: "Inter", "Cantarell", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .strip { animation: ws 9s cubic-bezier(.7,0,.3,1) infinite both; }
      @keyframes ws {
        0%, 26% { translate: 0 0; }
        33%, 59% { translate: -560px 0; }
        66%, 92% { translate: -1120px 0; }
        100% { translate: 0 0; }
      }
      .dot { animation: dot 9s cubic-bezier(.7,0,.3,1) infinite both; }
      @keyframes dot {
        0%, 26% { translate: 0 0; }
        33%, 59% { translate: 26px 0; }
        66%, 92% { translate: 52px 0; }
        100% { translate: 0 0; }
      }
      .pin { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; }
      @keyframes bob { 50% { translate: 0 -3px; } }
      @media (prefers-reduced-motion: reduce) { .strip, .dot, .pin { animation: none; } }
    </style>
  </defs>

  <!-- monitor -->
  <rect x="32" y="22" width="576" height="266" rx="18" fill="#08070e" stroke="#ffffff1a"/>
  <rect x="290" y="288" width="60" height="16" fill="#08070e"/>
  <rect x="250" y="302" width="140" height="8" rx="4" fill="#15131f"/>

  <g clip-path="url(#screen)">
    <rect x="40" y="30" width="560" height="250" fill="url(#wall)"/>

    <!-- three workspaces side by side -->
    <g class="strip">
      <!-- ws 1: editor + terminal -->
      <g>
        <rect x="52" y="64" width="300" height="204" rx="10" fill="#1d1a2a" stroke="#ab92ff" stroke-opacity=".7" stroke-width="2"/>
        <g class="mono" font-size="11" fill="#b8b4cf">
          <text x="68" y="92"><tspan fill="#ff7aab">def</tspan> <tspan fill="#6cb4ff">main</tspan>():</text>
          <text x="84" y="110"><tspan fill="#ff7aab">return</tspan> App().run()</text>
          <rect x="68" y="124" width="160" height="8" rx="4" fill="#ffffff12"/>
          <rect x="68" y="140" width="210" height="8" rx="4" fill="#ffffff12"/>
          <rect x="68" y="156" width="120" height="8" rx="4" fill="#ffffff12"/>
        </g>
        <rect x="362" y="64" width="226" height="204" rx="10" fill="#1d1a2a" stroke="#ffffff1a" stroke-width="2"/>
        <text x="378" y="92" class="mono" font-size="11" fill="#5bd69a">❯ <tspan fill="#b8b4cf">pytest</tspan></text>
        <text x="378" y="110" class="mono" font-size="11" fill="#5bd69a">58 passed</text>
      </g>
      <!-- ws 2: browser -->
      <g transform="translate(560 0)">
        <rect x="52" y="64" width="536" height="204" rx="10" fill="#1d1a2a" stroke="#ab92ff" stroke-opacity=".7" stroke-width="2"/>
        <rect x="68" y="78" width="504" height="18" rx="9" fill="#ffffff10"/>
        <rect x="68" y="112" width="240" height="14" rx="5" fill="#ffffff1c"/>
        <rect x="68" y="136" width="420" height="8" rx="4" fill="#ffffff10"/>
        <rect x="68" y="152" width="380" height="8" rx="4" fill="#ffffff10"/>
        <rect x="68" y="176" width="150" height="76" rx="8" fill="#6cb4ff22"/>
        <rect x="228" y="176" width="150" height="76" rx="8" fill="#ff7aab22"/>
      </g>
      <!-- ws 3: music + chat -->
      <g transform="translate(1120 0)">
        <rect x="52" y="64" width="260" height="204" rx="10" fill="#1d1a2a" stroke="#ffffff1a" stroke-width="2"/>
        <rect x="72" y="84" width="80" height="80" rx="10" fill="#f0c43c33"/>
        <rect x="72" y="178" width="200" height="8" rx="4" fill="#ffffff14"/>
        <rect x="72" y="194" width="140" height="8" rx="4" fill="#ffffff10"/>
        <rect x="72" y="236" width="220" height="4" rx="2" fill="#ffffff14"/>
        <rect x="72" y="236" width="90" height="4" rx="2" fill="#f0c43c"/>
        <rect x="322" y="64" width="266" height="204" rx="10" fill="#1d1a2a" stroke="#ab92ff" stroke-opacity=".7" stroke-width="2"/>
        <rect x="338" y="84" width="150" height="26" rx="13" fill="#ffffff12"/>
        <rect x="408" y="120" width="164" height="26" rx="13" fill="#ab92ff40"/>
        <rect x="338" y="156" width="120" height="26" rx="13" fill="#ffffff12"/>
      </g>
    </g>

    <!-- top bar with workspace indicator -->
    <rect x="40" y="30" width="560" height="24" fill="#08070ecc"/>
    <g fill="#ffffff30"><circle cx="64" cy="42" r="5"/><circle cx="90" cy="42" r="5"/><circle cx="116" cy="42" r="5"/></g>
    <circle class="dot" cx="64" cy="42" r="5" fill="#ab92ff"/>
    <text x="580" y="46" font-size="11" text-anchor="end" fill="#b8b4cf">14:07</text>

    <!-- the pinned note never moves -->
    <g filter="url(#sh)">
      <g transform="rotate(3 470 200)">
        <rect x="410" y="148" width="150" height="112" rx="12" fill="#fff4b0"/>
        <text x="426" y="176" font-size="14" font-weight="800" fill="#3d3510">Stand-up</text>
        <g fill="none" stroke="#a07000" stroke-width="1.8"><rect x="427" y="188" width="11" height="11" rx="3"/><rect x="427" y="208" width="11" height="11" rx="3"/></g>
        <path d="M429.5 193.5 l2.5 2.5 4-5" fill="none" stroke="#a07000" stroke-width="2" stroke-linecap="round"/>
        <text x="445" y="198" font-size="12" fill="#3d3510" fill-opacity=".5" text-decoration="line-through">review PR</text>
        <text x="445" y="218" font-size="12" fill="#3d3510">ship v0.1</text>
        <rect x="427" y="230" width="90" height="6" rx="3" fill="#3d3510" fill-opacity=".12"/>
      </g>
    </g>
    <g class="pin">
      <circle cx="548" cy="150" r="11" fill="#e5484d"/>
      <circle cx="545" cy="147" r="3.5" fill="#ffffff70"/>
    </g>
  </g>
</svg>
