<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Live Markdown</title>
  <desc id="d">A note switching between its Markdown source and the rendered read view.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      text { font-family: "Inter", "Cantarell", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; }
      .src { animation: src 7s ease-in-out infinite both; }
      .out { animation: out 7s ease-in-out infinite both; }
      @keyframes src { 0%, 38% { opacity: 1; } 46%, 92% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes out { 0%, 38% { opacity: 0; } 46%, 92% { opacity: 1; } 100% { opacity: 0; } }
      .chip-edit { animation: src 7s ease-in-out infinite both; }
      .chip-read { animation: out 7s ease-in-out infinite both; }
      .tick { stroke-dasharray: 20; stroke-dashoffset: 20; animation: tick 7s ease-out infinite both; }
      @keyframes tick { 0%, 55% { stroke-dashoffset: 20; } 62%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20; } }
      .pointer { animation: ptr 7s ease-in-out infinite both; }
      @keyframes ptr { 0%, 46% { opacity: 0; translate: 40px 30px; } 52% { opacity: 1; translate: 0 0; } 58% { opacity: 1; translate: 0 0; scale: .9; } 62% { scale: 1; } 80% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .src, .chip-edit, .pointer { animation: none; opacity: 0; }
        .out, .chip-read { animation: none; opacity: 1; }
        .tick { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g filter="url(#sh)">
    <rect x="150" y="24" width="340" height="252" rx="18" fill="#2f2846"/>
  </g>
  <g fill="#e3dbff" opacity=".35"><circle cx="176" cy="48" r="4"/><circle cx="190" cy="48" r="4"/><circle cx="204" cy="48" r="4"/></g>

  <!-- mode chip -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <g class="chip-edit"><rect x="408" y="38" width="62" height="20" rx="10" fill="#ab92ff" fill-opacity=".18"/><text x="439" y="52" fill="#ab92ff">EDITING</text></g>
    <g class="chip-read"><rect x="408" y="38" width="62" height="20" rx="10" fill="#5bd69a" fill-opacity=".18"/><text x="439" y="52" fill="#5bd69a">READING</text></g>
  </g>

  <!-- Markdown source, markers dimmed -->
  <g class="src mono" font-size="15" fill="#e3dbff">
    <text x="176" y="96" font-size="20" font-weight="700"><tspan fill-opacity=".35">## </tspan>Groceries</text>
    <text x="176" y="134"><tspan fill="#ab92ff">- [ ] </tspan>eggs <tspan fill-opacity=".35">**</tspan><tspan font-weight="700">urgent</tspan><tspan fill-opacity=".35">**</tspan></text>
    <text x="176" y="164"><tspan fill="#ab92ff">- [x] </tspan><tspan text-decoration="line-through" fill-opacity=".55">oat milk</tspan></text>
    <text x="176" y="194"><tspan fill="#ab92ff">- </tspan>see <tspan fill-opacity=".35">[</tspan><tspan fill="#ab92ff" text-decoration="underline">recipe</tspan><tspan fill-opacity=".35">](https://…)</tspan></text>
    <text x="176" y="234"><tspan fill-opacity=".35">&gt; </tspan><tspan font-style="italic" fill-opacity=".75">for sunday brunch</tspan></text>
  </g>

  <!-- Rendered read view -->
  <g class="out" font-size="16" fill="#e3dbff">
    <text x="176" y="98" font-size="24" font-weight="800">Groceries</text>
    <g fill="none" stroke="#ab92ff" stroke-width="2"><rect x="177" y="121" width="15" height="15" rx="4"/><rect x="177" y="151" width="15" height="15" rx="4"/></g>
    <path d="M180 158.5 l3.5 3.5 6-7" fill="none" stroke="#ab92ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="tick" d="M180 128.5 l3.5 3.5 6-7" fill="none" stroke="#ab92ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="134">eggs <tspan font-weight="800">urgent</tspan></text>
    <text x="202" y="164" text-decoration="line-through" fill-opacity=".5">oat milk</text>
    <text x="180" y="194"><tspan fill="#ab92ff" font-weight="800">•</tspan>  see <tspan fill="#ab92ff" text-decoration="underline">recipe</tspan></text>
    <rect x="176" y="218" width="3" height="22" rx="1.5" fill="#ab92ff" fill-opacity=".6"/>
    <text x="188" y="234" font-style="italic" fill-opacity=".75">for sunday brunch</text>
  </g>

  <!-- pointer clicking the checkbox -->
  <g class="pointer">
    <path d="M187 131 l0 18 4.5-4.5 3.5 7.5 3-1.5-3.5-7.5 6.5 0z" fill="#fff" stroke="#16141f" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
